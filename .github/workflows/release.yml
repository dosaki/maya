name: Release

# Every push to main builds Linux, Windows, macOS and Android again, in
# parallel and without the tests (the pull request ran them), and then,
# when the version in src-tauri/tauri.conf.json has no release yet,
# publishes v<version> with everything they built. A push whose version is
# already released only builds (`sh scripts/set-version.sh 0.3.0` sets the
# version everywhere; see CLAUDE.md for when to bump it).
on:
  push:
    branches: [main]

permissions:
  contents: write

# Pushes to main run one at a time, so two releases never race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    # A docs commit (conventional type `docs`, with or without a scope)
    # changes nothing that needs building or releasing.
    if: >-
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'docs(')
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release-version.sh >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      sign: ${{ needs.version.outputs.release == 'true' }}
      # The pull request ran them before the merge.
      test: false
    secrets: inherit

  # Only once every platform has built, so no release ever lacks an asset.
  release:
    name: Release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: maya-*
          merge-multiple: true
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist
          sh scripts/updater-manifest.sh "$VERSION" dist > latest.json
          mv latest.json dist/latest.json
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Maya v${VERSION}" \
            --generate-notes \
            --notes "Built from ${GITHUB_SHA} on main. macOS builds are not notarised: install with the one-line installer in the README, which clears the quarantine flag, or right-click the app and choose Open the first time. Windows installers are not signed: SmartScreen asks once, choose More info, then Run anyway. The Android APK is release-signed; allow installs from your browser to install it. Every APK after 0.21.0 is signed with the same key and installs over the one before; 0.21.0 and earlier each had a new key, so moving from one of those means uninstalling first, once, which forgets the pairings. From 0.18.0 the desktop app updates itself: a bar on the board offers each new release. An .msi or .deb install updates by hand."
