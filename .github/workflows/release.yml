name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

# Pushes to main run one at a time, so two releases never race; each pull
# request has its own group, and a newer push to it cancels the older run.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs first, on pushes and pull requests alike: the tests that keep
  # maya_core and the CLI portable. On a release push it also builds the
  # Linux binaries and hands them to the macOS job, which publishes the
  # release only once they exist, so no release ever lacks them.
  linux:
    name: Test core and CLI, build Linux binaries
    runs-on: ubuntu-latest
    # A docs commit (conventional type `docs`, with or without a scope)
    # changes nothing that needs building or releasing.
    if: >-
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'docs(')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install tmux for the integration test
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Test core and the CLI on Linux
        run: cargo test -p maya-core -p maya-cli
      - name: Read version
        id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release-version.sh >> "$GITHUB_OUTPUT"
      - name: Build Linux binaries
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          cargo install cross --version 0.2.5 --locked
          cross build -p maya-cli --release --target x86_64-unknown-linux-musl
          cross build -p maya-cli --release --target aarch64-unknown-linux-musl
          mkdir -p dist-linux
          cp target/x86_64-unknown-linux-musl/release/maya-cli dist-linux/maya-linux-x86_64
          cp target/aarch64-unknown-linux-musl/release/maya-cli dist-linux/maya-linux-aarch64
      - name: Hand the binaries to the macOS job
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist-linux/*
          if-no-files-found: error

  macos:
    name: Build and release (macOS)
    runs-on: macos-latest
    needs: linux
    # Pushes to main only; pull requests stop at the linux job. The docs
    # skip is the linux job's.
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'docs(')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the listener (both architectures)
        run: |
          sh scripts/build-ear.sh aarch64-apple-darwin
          sh scripts/build-ear.sh x86_64-apple-darwin

      - name: Test
        run: |
          pnpm test
          sh scripts/test-ear.sh
          cargo test --workspace

      # The version in src-tauri/tauri.conf.json is the release version
      # (`sh scripts/set-version.sh 0.2.0` sets it everywhere). A push whose
      # version already has a release only runs the tests.
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release-version.sh >> "$GITHUB_OUTPUT"

      # With the three APPLE_* secrets set, the certificate goes into a
      # keychain of its own and is marked trusted for code signing (a
      # self-signed certificate is not, and Tauri only accepts identities
      # that `find-identity -v` lists). Tauri then signs the app, the
      # listener and the whisper framework with APPLE_SIGNING_IDENTITY.
      # Without the secrets the bundles stay ad-hoc signed.
      - name: Signing identity (when the secrets are set)
        if: steps.version.outputs.release == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "no signing secrets; bundles will be ad-hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | tr -d '" ' | tr '\n' ' ')"
          # shellcheck disable=SC2086 # the existing keychains are a space-separated list
          security list-keychains -d user -s "$keychain" $existing
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/signing.p12"
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "signing as $APPLE_SIGNING_IDENTITY"

      - name: Build (Apple Silicon)
        if: steps.version.outputs.release == 'true'
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Build (Intel)
        if: steps.version.outputs.release == 'true'
        run: pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg

      - name: Package
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cargo build -p maya-cli --release --target aarch64-apple-darwin
          cargo build -p maya-cli --release --target x86_64-apple-darwin
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp=none target/aarch64-apple-darwin/release/maya-cli
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp=none target/x86_64-apple-darwin/release/maya-cli
          fi
          cp target/aarch64-apple-darwin/release/maya-cli dist-release/maya-macos-arm64
          cp target/x86_64-apple-darwin/release/maya-cli dist-release/maya-macos-x86_64
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            arch="${target%%-*}"
            bundle="target/$target/release/bundle"
            tar -C "$bundle/macos" -czf "dist-release/Maya_${VERSION}_${arch}.app.tar.gz" Maya.app
            cp "$bundle"/dmg/*.dmg "dist-release/Maya_${VERSION}_${arch}.dmg"
          done
          ls -la dist-release

      - name: Add the Linux binaries
        if: steps.version.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-release

      - name: Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" dist-release/* \
            --title "Maya v${VERSION}" \
            --generate-notes \
            --notes "Built from ${GITHUB_SHA} on main. macOS builds are not notarised: install with the one-line installer in the README, which clears the quarantine flag, or right-click the app and choose Open the first time."
