name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    name: Build and release (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the listener (both architectures)
        run: |
          sh scripts/build-ear.sh aarch64-apple-darwin
          sh scripts/build-ear.sh x86_64-apple-darwin

      - name: Test
        run: |
          pnpm test
          sh scripts/test-ear.sh
          cd src-tauri && cargo test

      # The version in src-tauri/tauri.conf.json is the release version
      # (`sh scripts/set-version.sh 0.2.0` sets it everywhere). A push whose
      # version already has a release only runs the tests.
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [ "$version" != "$pkg" ] || [ "$version" != "$cargo_version" ]; then
            echo "version mismatch: tauri.conf.json=$version package.json=$pkg Cargo.toml=$cargo_version" >&2
            echo "run: sh scripts/set-version.sh $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; bump the version to publish another"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # With the three APPLE_* secrets set, Tauri imports the certificate into
      # a temporary keychain and signs the app, the listener and the whisper
      # framework with it. Without them the bundles stay ad-hoc signed.
      - name: Signing identity (when the secrets are set)
        if: steps.version.outputs.release == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "signing as $APPLE_SIGNING_IDENTITY"
          else
            echo "no signing secrets; bundles will be ad-hoc signed"
          fi

      - name: Build (Apple Silicon)
        if: steps.version.outputs.release == 'true'
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Build (Intel)
        if: steps.version.outputs.release == 'true'
        run: pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg

      - name: Package
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            arch="${target%%-*}"
            bundle="src-tauri/target/$target/release/bundle"
            tar -C "$bundle/macos" -czf "dist-release/Maya_${VERSION}_${arch}.app.tar.gz" Maya.app
            cp "$bundle"/dmg/*.dmg "dist-release/Maya_${VERSION}_${arch}.dmg"
          done
          ls -la dist-release

      - name: Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" dist-release/* \
            --title "Maya v${VERSION}" \
            --generate-notes \
            --notes "Built from ${GITHUB_SHA} on main. macOS builds are not notarised: install with the one-line installer in the README, which clears the quarantine flag, or right-click the app and choose Open the first time."
