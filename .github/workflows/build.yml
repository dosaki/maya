name: Build

# Tests and builds Maya on Linux, Windows, macOS and Android, all in
# parallel, and keeps what each built as run artifacts. Called by ci.yml for every
# pull request and by release.yml for every push to main, which builds
# without the tests (the pull request ran them); it never publishes
# anything itself.
on:
  workflow_call:
    inputs:
      sign:
        description: Sign the macOS apps when the APPLE_* secrets are set (releases only).
        type: boolean
        default: false
      test:
        description: Run the tests before building. A release skips them; its pull request ran them.
        type: boolean
        default: true
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # The CLI built natively for each architecture on its own runner (the
  # cross-rs images lag the toolchain). Its tests, and maya_core's, run in
  # linux-app's `cargo test --workspace`.
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      # musl-tools links the static binary.
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the CLI
        run: |
          set -euo pipefail
          cargo build -p maya-cli --release --target ${{ matrix.target }}
          mkdir -p release
          cp target/${{ matrix.target }}/release/maya-cli release/maya-linux-${{ matrix.arch }}
          ./release/maya-linux-${{ matrix.arch }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: maya-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  # The desktop app for Linux: the whole workspace's tests, the two
  # sidecars, a .deb and an AppImage per architecture, and a launch under a
  # virtual display that must paint the board.
  linux-app:
    name: Linux app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: that moves to 26.04, whose glibc
          # (2.43) the bundles would then need, and they would no longer
          # run on 24.04.
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deb: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deb: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          # whisper-rs-sys does not rebuild when GGML_NATIVE changes, so a
          # cache from before scripts/build-ear.sh set it would keep a
          # whisper.cpp tuned for the runner's CPU.
          key: ggml-portable
      - name: Install the GTK, audio and desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake clang libasound2-dev tmux libnotify-bin speech-dispatcher pulseaudio-utils xvfb imagemagick
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # maya-ear (whisper.cpp built in) and maya-hook, as Tauri sidecars.
      - name: Build the sidecars
        run: sh scripts/build-ear.sh ${{ matrix.target }}
      - name: Test
        if: inputs.test
        run: |
          pnpm test
          sh scripts/test-ear.sh
          cargo test --workspace
      - name: Build the bundles
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pnpm tauri build --bundles deb,appimage
          mkdir -p release
          cp target/release/bundle/deb/*.deb "release/Maya_${version}_${{ matrix.deb }}.deb"
          cp target/release/bundle/appimage/*.AppImage "release/Maya_${version}_${{ matrix.deb }}.AppImage"
          chmod +x release/*.AppImage
          ls -la release
      # The AppImage, run from a path with a space in it and a fresh HOME,
      # must stay up and log "started"; the screenshot shows the board it
      # painted. Start-up under xvfb can take over 30 s, so the wait is 60 s.
      - name: Smoke test under a virtual display
        run: |
          set -euo pipefail
          mkdir -p "/tmp/maya smoke" && cp release/*.AppImage "/tmp/maya smoke/Maya.AppImage"
          export HOME="$(mktemp -d)"
          xvfb-run -a sh -c '"/tmp/maya smoke/Maya.AppImage" --appimage-extract-and-run & pid=$!
            for i in $(seq 1 120); do grep -q "started" "$HOME/.claude/maya/maya.log" 2>/dev/null && break; sleep 0.5; done
            sleep 3; import -window root smoke-${{ matrix.arch }}.png
            kill -0 $pid || { echo "Maya exited early"; exit 1; }
            grep -q "started" "$HOME/.claude/maya/maya.log" || { echo "Maya never logged started"; cat "$HOME/.claude/maya/maya.log" || true; exit 1; }
            kill $pid'
      - uses: actions/upload-artifact@v4
        with:
          name: maya-linux-app-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.arch }}
          path: smoke-${{ matrix.arch }}.png
          if-no-files-found: ignore

  # The Windows port's tests, then the sidecars and the NSIS and MSI
  # installers. The installers are not Authenticode-signed yet, so
  # SmartScreen warns on first run.
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          # whisper-rs-sys does not rebuild when GGML_NATIVE changes, so a
          # cache from before scripts/build-ear.sh set it would keep a
          # whisper.cpp tuned for the runner's CPU.
          key: ggml-portable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # maya-ear (whisper.cpp built in) and maya-hook, as Tauri sidecars.
      - name: Build the sidecars
        run: sh scripts/build-ear.sh x86_64-pc-windows-msvc
      - name: Test
        if: inputs.test
        run: |
          pnpm test
          cargo test -p maya-core -p maya-hook -p maya-ear -p maya
      - name: Build the installers
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pnpm tauri build --bundles nsis,msi
          mkdir -p release
          cp target/release/bundle/nsis/*-setup.exe "release/Maya_${version}_x64-setup.exe"
          cp target/release/bundle/msi/*.msi "release/Maya_${version}_x64.msi"
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: maya-windows
          path: release/*
          if-no-files-found: error

  # The app, its disk image and the macOS CLI binary, one job per
  # architecture, both on Apple Silicon runners: the Intel build is
  # cross-compiled. The whole workspace's tests run in the Apple Silicon
  # job, natively.
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            cli: arm64
          - arch: x86_64
            target: x86_64-apple-darwin
            cli: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          # One cache per architecture: the two jobs build different targets.
          key: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the listener
        run: sh scripts/build-ear.sh ${{ matrix.target }}
      - name: Test
        if: inputs.test && matrix.arch == 'aarch64'
        run: |
          pnpm test
          sh scripts/test-ear.sh
          cargo test --workspace

      # For a release with the three APPLE_* secrets set, the certificate
      # goes into a keychain of its own and is marked trusted for code
      # signing (a self-signed certificate is not, and Tauri only accepts
      # identities that `find-identity -v` lists). Tauri then signs the app,
      # the listener and the whisper framework with APPLE_SIGNING_IDENTITY.
      # Otherwise, and on every pull request, the bundles stay ad-hoc signed.
      - name: Signing identity (releases with the secrets set)
        if: inputs.sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "no signing secrets; bundles will be ad-hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | tr -d '" ' | tr '\n' ' ')"
          # shellcheck disable=SC2086 # the existing keychains are a space-separated list
          security list-keychains -d user -s "$keychain" $existing
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/signing.p12"
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "signing as $APPLE_SIGNING_IDENTITY"

      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
      - name: Package
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          target="${{ matrix.target }}"
          mkdir -p release
          cargo build -p maya-cli --release --target "$target"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp=none "target/$target/release/maya-cli"
          fi
          cp "target/$target/release/maya-cli" "release/maya-macos-${{ matrix.cli }}"
          bundle="target/$target/release/bundle"
          tar -C "$bundle/macos" -czf "release/Maya_${version}_${{ matrix.arch }}.app.tar.gz" Maya.app
          cp "$bundle"/dmg/*.dmg "release/Maya_${version}_${{ matrix.arch }}.dmg"
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: maya-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  # The phone's app: the host-side tests (the hub against a core client on
  # localhost, the planner, the page), then an arm64 APK. Signed with the
  # keystore from the ANDROID_* secrets on a release; debug-signed
  # otherwise, which still installs on your own phone.
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: android
      - name: Install the desktop libraries the host-side tests link against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        if: inputs.test
        run: |
          pnpm test
          cargo test -p maya-mobile
      - name: Signing (releases with the secrets set)
        if: inputs.sign
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "no signing secrets; the APK will be debug-signed"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/maya.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/maya.jks"
          } > mobile/gen/android/keystore.properties
          echo "signing with the release keystore"
      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: pnpm mobile:build
      - name: Package
        run: |
          set -euo pipefail
          version="$(node -p "require('./mobile/tauri.conf.json').version")"
          mkdir -p release
          apk="$(ls mobile/gen/android/app/build/outputs/apk/*/release/*.apk | head -n 1)"
          cp "$apk" "release/Maya_${version}.apk"
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: maya-android
          path: release/*
          if-no-files-found: error
