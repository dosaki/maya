[package]
name = "maya-ear"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Maya's ear on Windows and Linux: whisper.cpp speech recognition streamed as JSON lines"

[lib]
name = "maya_ear"
path = "src/lib.rs"

[[bin]]
name = "maya-ear"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true

# The audio and the recogniser run on Windows and Linux: macOS has the Swift ear.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
cpal = "0.18"
whisper-rs = "0.16"
