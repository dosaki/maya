[package]
name = "maya-ear"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Maya's ear on Windows: whisper.cpp speech recognition streamed as JSON lines"

[lib]
name = "maya_ear"
path = "src/lib.rs"

[[bin]]
name = "maya-ear"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true

# The audio and the recogniser are Windows-only: macOS has the Swift ear.
[target.'cfg(windows)'.dependencies]
cpal = "0.18"
whisper-rs = "0.16"
