<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maya</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1 class="topbar__title" title="Manage All Your Agents">Maya</h1>
        <nav class="tabs" role="tablist">
          <button class="tab" type="button" role="tab" data-tab="sessions">Sessions
            <span class="tab__count tab__count--idle" data-count="idle"></span><span class="tab__count tab__count--working" data-count="working"></span><span class="tab__count tab__count--awaiting" data-count="awaiting"></span><span class="tab__count tab__count--completed" data-count="completed"></span>
          </button>
          <button class="tab" type="button" role="tab" data-tab="reviews">Pull Requests <span class="tab__count" id="reviews-count"></span></button>
        </nav>
        <button class="topbar__settings" id="settings-toggle" type="button">Settings</button>
      </header>
      <div id="board"></div>
      <div id="reviews" hidden></div>
      <aside id="settings" class="settings" hidden></aside>
      <div id="modal-host"></div>
      <div id="toast" class="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
