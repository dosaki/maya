<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maya</title>
    <!-- Runs before the stylesheet paints, so a light theme does not flash dark first. Same key as src/theme.ts. -->
    <script>try{if(localStorage.getItem("maya.colorTheme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1 class="topbar__title" title="Manage All Your Agents"><img class="topbar__logo" src="/src/assets/maya-logo.png" alt="" width="26" height="26" /> Maya</h1>
        <nav class="tabs" role="tablist">
          <button class="tab" type="button" role="tab" data-tab="sessions">Sessions
            <span class="tab__count tab__count--idle" data-count="idle"></span><span class="tab__count tab__count--working" data-count="working"></span><span class="tab__count tab__count--awaiting" data-count="awaiting"></span><span class="tab__count tab__count--completed" data-count="completed"></span>
          </button>
          <button class="tab" type="button" role="tab" data-tab="reviews">Pull Requests <span class="tab__count" id="reviews-count"></span></button>
          <button class="tab" type="button" role="tab" data-tab="deployments">Deployments <span class="tab__count" id="deployments-count"></span></button>
          <button class="tab" type="button" role="tab" data-tab="chat">Chat <span class="tab__dot tab__dot--idle"></span></button>
          <span class="tabs__spacer"></span>
          <span id="mute-host"></span>
          <span id="voice-host"></span>
          <button class="tab" type="button" role="tab" data-tab="debug" hidden>Debug</button>
          <button class="tab" type="button" role="tab" data-tab="settings">Settings</button>
        </nav>
      </header>
      <div id="update-bar" hidden></div>
      <div id="session-search" class="session-search"></div>
      <div id="remembered" class="remembered-host"></div>
      <div id="board"></div>
      <div id="reviews" hidden></div>
      <div id="deployments" hidden></div>
      <section id="chat" class="pane" hidden></section>
      <div id="debug" class="pane" hidden></div>
      <div id="settings" class="settings pane" hidden></div>
      <aside id="voice-panel" class="settings popover" hidden></aside>
      <div id="modal-host"></div>
      <div id="toast" class="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
